<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多智能体对话</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f7f7f8; height: 100vh; }
    #app { display: flex; height: 100vh; }

    /* ===== 左侧边栏 ===== */
    .sidebar {
      width: 240px;
      background: #f0f0f1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }
    .sidebar .btn-new {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    .sidebar .btn-new:hover { background: #e8e8e8; }
    .conv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .conv-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #333;
    }
    .conv-item:hover { background: #e4e4e6; }
    .conv-item.active { background: #d8dce6; }
    .conv-item .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
    .conv-item .del { color: #bbb; padding: 0 4px; }
    .conv-item .del:hover { color: #f56c6c; }
    .sidebar-footer { border-top: 1px solid #ddd; padding-top: 8px; display: flex; gap: 6px; }
    .sidebar-footer .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: #666; font-size: 13px; cursor: pointer; }
    .sidebar-footer .tab-btn.active { background: #4d6bfe; color: #fff; }

    /* ===== 右侧主区 ===== */
    .main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .main-topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; width: 100%; max-width: 760px; margin: 0 auto; }
    .model-select {
      border: 1px solid #e5e5e5; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #666; background: #fff; outline: none; margin-right: 8px;
    }

    /* 空状态 */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
    .empty-state .logo { font-size: 48px; }
    .empty-state h2 { font-size: 24px; color: #1f1f1f; }
    .empty-state p { color: #999; font-size: 14px; }
    .suggest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; width: 100%; max-width: 520px; }
    .suggest-card { padding: 14px 16px; border: 1px solid #e5e5e5; border-radius: 12px; background: #fff; color: #333; font-size: 14px; cursor: pointer; text-align: left; transition: box-shadow .2s, border-color .2s; }
    .suggest-card:hover { border-color: #4d6bfe; box-shadow: 0 2px 8px rgba(77,107,254,.1); }

    /* 聊天区 */
    .chat-area { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 760px; margin: 0 auto; }
    .msg { line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #f4f6f8; padding: 10px 14px; border-radius: 12px; color: #1f1f1f; max-width: 85%; }
    .msg.assistant { align-self: flex-start; color: #1f1f1f; }
    .msg.system { align-self: center; color: #e65100; font-size: 13px; background: #fff3e0; padding: 6px 12px; border-radius: 8px; }
    .status-line { font-size: 12px; margin-top: 6px; }
    .status-line.running { color: #4d6bfe; }
    .status-line.done { color: #67c23a; }
    .status-line.error { color: #f56c6c; }
    .cursor { color: #4d6bfe; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* 输入区 */
    .input-wrap { padding: 0 20px 20px; width: 100%; max-width: 760px; margin: 0 auto; }
    .input-box { border: 1px solid #e5e5e5; border-radius: 14px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.04); padding: 12px 14px; }
    .input-box textarea { width: 100%; border: none; outline: none; resize: none; font-size: 15px; font-family: inherit; line-height: 1.6; max-height: 120px; color: #1f1f1f; }
    .input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .path-inline {
      flex: 1; padding: 6px 10px; border: 1px solid #e5e5e5; border-radius: 8px;
      font-size: 12px; color: #666; outline: none; background: #fafafa;
    }
    .path-inline:focus { border-color: #4d6bfe; background: #fff; }
    .btn-send { width: 36px; height: 36px; border: none; border-radius: 50%; background: #4d6bfe; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .2s; }
    .btn-send:disabled { background: #c8c8c8; cursor: not-allowed; }
    .btn-send.btn-stop { width: auto; padding: 0 14px; border-radius: 18px; font-size: 13px; background: #f56c6c; }

    /* 状态页 */
    .status-area { flex: 1; overflow-y: auto; padding: 20px; }
    .status-hint { color: #999; font-size: 13px; margin-bottom: 12px; }
    .status-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 10px; }
    .status-card .name { font-weight: 600; color: #333; }
    .badge { padding: 4px 12px; border-radius: 12px; font-size: 13px; color: #fff; }
    .badge.closed { background: #67c23a; }
    .badge.open { background: #f56c6c; }
    .badge.half_open { background: #e6a23c; }
    .empty { color: #999; text-align: center; padding: 40px; }
  </style>
</head>
<body>
<div id="app">
  <!-- ===== 左侧边栏 ===== -->
  <div class="sidebar">
    <button class="btn-new" @click="newChat">＋ 新对话</button>
    <div class="conv-list">
      <div v-if="conversations.length===0" class="empty">暂无会话</div>
      <div v-for="c in conversations" :key="c.id" class="conv-item" :class="{active: c.id===currentId}" @click="selectConv(c.id)">
        <span class="title">{{ c.title }}</span>
        <span class="del" @click.stop="deleteConv(c.id)">×</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="tab-btn" :class="{active: tab==='chat'}" @click="tab='chat'">对话</button>
      <button class="tab-btn" :class="{active: tab==='status'}" @click="tab='status'">熔断状态</button>
    </div>
  </div>

  <!-- ===== 右侧主区 ===== -->
  <div class="main">

    <!-- 聊天页 -->
    <template v-if="tab==='chat'">
      <div class="empty-state" v-if="messages.length===0">
        <div class="logo">🤖</div>
        <h2>多智能体系统</h2>
        <p>协调 rag_agent 知识库检索 · doc_agent 文档读写</p>
        <div class="suggest-grid">
          <div class="suggest-card" @click="quickAsk('你好，介绍一下你自己')">👋 你好，介绍一下你自己</div>
          <div class="suggest-card" @click="quickAsk('你能做什么？')">💡 你能做什么？</div>
          <div class="suggest-card" @click="quickAsk('总结知识库中关于混凝土养护的内容')">📚 知识库检索示例</div>
          <div class="suggest-card" @click="quickAsk('把上一轮结果写入 Word 文件')">📄 文档读写示例</div>
        </div>
      </div>

      <div class="chat-area" v-else ref="chatArea">
        <div v-for="(m, i) in messages" :key="i" class="msg" :class="m.role">
          {{ m.content }}<span v-if="m.role==='assistant' && i===messages.length-1 && streaming" class="cursor">▍</span>
          <div v-if="m.role==='assistant' && i===messages.length-1 && streaming" class="status-line running">⏳ 正在执行中... {{ elapsed }}秒</div>
          <div v-else-if="m.role==='assistant' && m.status==='done'" class="status-line done">✅ 执行完成，用时 {{ m.duration }}秒</div>
          <div v-else-if="m.role==='assistant' && m.status==='error'" class="status-line error">❌ 执行异常：{{ m.error }}</div>
        </div>
      </div>

      <div class="input-wrap">
        <div class="input-box">
          <textarea v-model="input" placeholder="给智能体发消息" :disabled="streaming" rows="1"
                    @keydown.enter.exact.prevent="send"></textarea>
          <div class="input-footer">
            <select class="model-select" v-model="model" :disabled="streaming">
              <option value="">{{ defaultModel ? defaultModel + '(默认)' : '默认模型' }}</option>
              <option v-for="m in models" :key="m" :value="m">{{ m }}</option>
            </select>
            <input class="path-inline" v-model="workspacePath" placeholder="工作目录（可选，如 任务A）" />
            <button class="btn-send" :class="{ 'btn-stop': streaming }" @click="streaming ? stop() : send()" :disabled="!streaming && !input.trim()">{{ streaming ? '■ 停止' : '➤' }}</button>
          </div>
        </div>
      </div>
    </template>

    <!-- 状态页 -->
    <div class="status-area" v-else>
      <div class="status-hint">每 3 秒自动刷新 · closed=正常 / open=已熔断 / half_open=试探恢复</div>
      <!-- ===== 接口点2：/api/health/breakers ===== -->
      <div v-if="Object.keys(breakers).length===0" class="empty">暂无熔断器数据（调用过模型后出现）</div>
      <div v-for="(state, name) in breakers" :key="name" class="status-card">
        <span class="name">{{ name }}</span>
        <span class="badge" :class="state">{{ stateLabel(state) }}</span>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      tab: 'chat',
      conversations: [],
      currentId: null,
      input: '',
      workspacePath: '',
      models: [],
      model: '',
      defaultModel: '',   // 后端返回的默认模型名
      breakers: {},
      streaming: false,
      abortController: null,   // 用于停止当前流式请求
      timer: null,
      elapsed: 0,
      timer2: null,
    };
  },
  computed: {
    // 当前会话对象
    current() {
      return this.conversations.find(c => c.id === this.currentId) || null;
    },
    // 当前会话的消息（界面直接绑定这个）
    messages() {
      return this.current ? this.current.messages : [];
    },
  },
  watch: {},   // 会话改为服务端持久化，不再存 localStorage
  methods: {
    // ===== 接口点1：加载模型列表 =====
    // ===== 从后端拉会话列表（服务端持久化） =====
    async loadConversations() {
      try {
        const r = await fetch('/api/conversations');
        const j = await r.json();
        this.conversations = (j.data || []).map(c => ({
          id: c.session_id,
          title: c.title,
          messages: [],
          loaded: false,
        }));
        this.currentId = this.conversations.length ? this.conversations[0].id : null;
      } catch (e) {
        this.conversations = [];
      }
    },

    async loadModels() {
      try {
        const r = await fetch('/api/models');
        const j = await r.json();
        this.models = j.data || [];
        this.defaultModel = j.default_model || '';
      } catch (e) { console.error('加载模型失败', e); }
    },

    // ===== 接口点2：加载熔断状态 =====
    async loadBreakers() {
      try {
        const r = await fetch('/api/health/breakers');
        const j = await r.json();
        this.breakers = j.data || {};
      } catch (e) { console.error('加载熔断状态失败', e); }
    },

    stateLabel(s) {
      return { closed: '正常', open: '已熔断', half_open: '试探恢复' }[s] || s;
    },

    // ===== 新对话：进入草稿态（不发消息就不建会话） =====
    newChat() {
      this.currentId = null;
      this.input = '';
      this.workspacePath = '';   // 新对话清空路径 → 回到默认沙箱根
    },

    // ===== 确保有当前会话（发消息时才真正创建） =====
    ensureConversation() {
      if (this.current) return;
      const conv = { id: 'web-' + Date.now(), title: '新对话', messages: [], loaded: true };
      this.conversations.unshift(conv);
      this.currentId = conv.id;
    },

    // ===== 切换会话：首次点开从后端拉历史消息 =====
    async selectConv(id) {
      this.currentId = id;
      const conv = this.conversations.find(c => c.id === id);
      if (conv && !conv.loaded) {
        conv.loaded = true;
        try {
          const r = await fetch('/api/conversations/' + encodeURIComponent(id) + '/messages');
          const j = await r.json();
          const msgs = (j.data || []).filter(m => m.role !== 'tool');   // 工具日志不展示
          conv.messages = msgs.map(m => m.role === 'human'
            ? { role: 'user', content: m.content }
            : { role: 'assistant', content: m.content });
          // 从历史消息恢复工作目录：取最后一条带"执行到目录"的用户消息
          const pathMatch = msgs
            .filter(m => m.role === 'human' && m.content.includes('请将文件操作执行到目录：'))
            .map(m => { const mm = m.content.match(/请将文件操作执行到目录：(.+?)。任务：/); return mm ? mm[1] : null; })
            .filter(Boolean)
            .pop();
          if (pathMatch) this.workspacePath = pathMatch;
        } catch (e) { /* 拉取失败不阻塞 */ }
      }
    },

    // ===== 删除会话：调后端软删 + 前端移除 =====
    async deleteConv(id) {
      try {
        await fetch('/api/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
      } catch (e) { /* 删除失败也移除本地 */ }
      this.conversations = this.conversations.filter(c => c.id !== id);
      if (this.currentId === id) {
        this.currentId = this.conversations.length ? this.conversations[0].id : null;
      }
    },

    quickAsk(text) {
      this.input = text;
      this.send();
    },

    // ===== 核心：发送 + 流式接收 =====
    async send() {
      let text = this.input.trim();
      if (!text || this.streaming) return;
      // 有工作路径 → 拼进任务描述（让 doc_agent 知道目标目录），并单独传 workspace_path（后端切沙箱根）
      if (this.workspacePath.trim()) {
        text = `请将文件操作执行到目录：${this.workspacePath.trim()}。任务：${text}`;
      }
      this.ensureConversation();

      // 首条消息 → 自动设会话标题（优先取文件名）
      if (this.current.messages.length === 0) {
        const m = text.match(/([\w\u4e00-\u9fa5]+\.\w+)/);
        this.current.title = m ? m[1] : text.slice(0, 20);
      }
      this.current.messages.push({ role: 'user', content: text });
      this.current.messages.push({ role: 'assistant', content: '', status: 'running', duration: 0, error: '' });
      this.input = '';
      this.abortController = new AbortController();   // 创建可中止句柄
      this.streaming = true;
      this.startTime = Date.now();
      this.elapsed = 0;
      clearInterval(this.timer2);
      this.timer2 = setInterval(() => {
        this.elapsed = Math.floor((Date.now() - this.startTime) / 1000);
      }, 1000);
      this.scrollBottom();

      try {
        // ===== 接口点3：POST /api/chat/stream（SSE） =====
        const resp = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: this.abortController.signal,   // 支持中止
          body: JSON.stringify({
            query: text,
            session_id: this.current.id,   // 会话 id 即后端 session_id（服务端持久化）
            model: this.model || null,
            workspace_path: this.workspacePath.trim() || '',   // 空字符串而非 null，避免 pydantic 422
          }),
        });

        const lastMsg = this.current.messages[this.current.messages.length - 1];
        if (!resp.ok) {
          const errText = await resp.text();
          lastMsg.content = '请求失败(HTTP ' + resp.status + '): ' + (errText || '');
          lastMsg.status = 'error';
          lastMsg.error = 'HTTP ' + resp.status;
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) {
            if (part.startsWith('data: ')) {
              const payload = JSON.parse(part.slice(6));
              if (payload.content) lastMsg.content += payload.content;
              if (payload.error) lastMsg.content = '错误: ' + payload.error;
            }
          }
          this.scrollBottom();
        }
      } catch (e) {
        const lm = this.current.messages[this.current.messages.length - 1];
        if (e.name === 'AbortError') {
          // 用户手动停止，stop() 已处理状态，这里不覆盖
        } else {
          lm.content = '请求失败: ' + e.message;
          lm.status = 'error';
          lm.error = e.message;
        }
      } finally {
        clearInterval(this.timer2);
        this.streaming = false;
        this.abortController = null;
        const lm = this.current.messages[this.current.messages.length - 1];
        if (lm && lm.status === 'running') {
          if (lm.content && lm.content.trim()) {
            lm.status = 'done';
            lm.duration = ((Date.now() - this.startTime) / 1000).toFixed(1);
          } else {
            // 流式结束但没有任何回复 -> 显示异常，而不是"执行完成"
            lm.status = 'error';
            lm.content = '执行异常：没有收到任何回复';
            lm.error = '没有收到任何回复';
          }
        }
      }
    },

    // ===== 停止当前流式请求 =====
    stop() {
      if (this.abortController) this.abortController.abort();
      const lm = this.current.messages[this.current.messages.length - 1];
      if (lm && lm.status === 'running') {
        lm.status = 'error';
        if (!lm.content) lm.content = '（已手动停止）';
        lm.error = '已手动停止';
      }
      clearInterval(this.timer2);
      this.streaming = false;
    },

    scrollBottom() {
      this.$nextTick(() => {
        const el = this.$refs.chatArea;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
  },
  mounted() {
    // 会话从后端加载（服务端持久化，任何设备都能找回）
    this.loadConversations();
    this.loadModels();
    this.loadBreakers();
    this.timer = setInterval(this.loadBreakers, 3000);
  },
  beforeUnmount() {
    if (this.timer) clearInterval(this.timer);
  },
}).mount('#app');
</script>
</body>
</html>
