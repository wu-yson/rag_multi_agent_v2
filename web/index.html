<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-size='12' font-weight='bold' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能体助手</title>
  <style>
    :root {
      --bg: #f6f7fb; --panel: #fff; --sidebar: #f2f3f7; --border: #e6e8ef;
      --muted: #6b7280; --text: #1f2937; --primary: #4f46e5; --primary-soft: #eef2ff;
      --danger: #ef4444; --ok: #16a34a; --warn: #d97706;
      --radius: 16px; --shadow: 0 10px 30px rgba(15,23,42,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
    #app { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: 100vh; height: 100vh; overflow: hidden; transition: grid-template-columns .2s ease; }
    #app.panel-closed { grid-template-columns: 280px 1fr 0; }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; flex: 0 0 auto; }
    .brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; display: grid; place-items: center; font-size: 14px; }
    .new-conv { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--primary); font-size: 13px; cursor: pointer; flex: 0 0 auto; text-align: left; padding: 0 12px; }
    .new-conv:hover { background: var(--primary-soft); border-color: #c7d2fe; }
    .new-project { width: 100%; height: 36px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-size: 13px; cursor: pointer; flex: 0 0 auto; text-align: left; padding: 0 12px; }
    .project-list { flex: 1; overflow: auto; min-height: 0; }
    .project { margin-bottom: 6px; border-radius: 12px; overflow: hidden; }
    .project-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: #333; user-select: none; }
    .project-header:hover { background: #e9ebf2; }
    .project.open .project-header { background: #e3e6f5; color: #333; }
    .project.active-project .project-header { background: #dbeafe; color: #333; }
    .project-header .folder-icon { display: inline-flex; align-items: center; margin-right: 5px; vertical-align: middle; }
    .project-header .name-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-header .path-line { display: block; font-size: 10.5px; font-weight: 400; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
    .brand { cursor: pointer; }
    .brand:hover .brand-mark { opacity: .85; }
    .project-menu-btn { font-size: 14px; color: #9ca3af; cursor: pointer; padding: 0 5px; border-radius: 5px; line-height: 1; }
    .project-menu-btn:hover { color: var(--primary); background: #d8dcf5; }
    .project-dropdown {
      position: fixed; background: #fff; border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow); padding: 4px; z-index: 200; min-width: 110px;
    }
    .project-menu-item {
      padding: 7px 12px; font-size: 12.5px; color: #374151; cursor: pointer; border-radius: 7px;
    }
    .project-menu-item:hover { background: var(--primary-soft); color: var(--primary); }
    .conv-list { display: none; flex-direction: column; gap: 2px; padding: 2px 8px 8px 22px; }
    .project.open .conv-list { display: flex; }
    .conv-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
    .conv-item:hover { background: #e5e7f0; }
    .conv-item.active { background: #dfe2ff; color: #333; font-weight: 600; }
    .conv-title { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .conv-del { color: #b0b5c4; cursor: pointer; padding: 0 3px; font-size: 12px; flex: 0 0 auto; }
    .conv-del:hover { color: var(--danger); }
    .conv-menu-btn { font-size: 13px; color: #b0b5c4; cursor: pointer; padding: 0 4px; border-radius: 5px; line-height: 1; flex: 0 0 auto; }
    .conv-menu-btn:hover { color: var(--primary); background: #e5e7f0; }
    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
    .footer-link { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 9px; font-size: 12px; color: var(--muted); }
    .footer-link.clickable { cursor: pointer; }
    .footer-link.clickable:hover { background: #e9ebf2; }
    .footer-link.disabled { opacity: .5; cursor: default; }
    .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; }
    .doc-brush { flex: 0 0 auto; cursor: pointer; color: #b0b5c4; padding: 0 3px; border-radius: 4px; }
    .doc-brush:hover { color: var(--danger); background: #fee2e2; }
    .doc-clear-btn { font-size: 11px; color: #9ca3af; cursor: pointer; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: #fff; }
    .doc-clear-btn:hover { color: var(--danger); border-color: #fca5a5; background: #fef2f2; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.error { background: #fee2e2; color: #991b1b; }
    .badge.idle { background: #f3f4f6; color: #9ca3af; }    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .topbar { height: 60px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; flex: 0 0 auto; }
    .top-title { font-weight: 700; font-size: 16px; }
    .top-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .panel-toggle { border: none; background: transparent; color: #374151; height: 34px; padding: 0 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
    .panel-toggle:hover { border-color: #c7d2fe; background: var(--primary-soft); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .status-dot.ok { background: var(--ok); }
    .status-dot.warn { background: var(--warn); }
    .status-dot.error { background: var(--danger); }
    .status-dot.off { background: #9ca3af; }
    .chat { flex: 1 1 0; min-height: 0; overflow-y: auto; width: min(860px, 100%); margin: 0 auto; padding: 28px 24px 20px; display: flex; flex-direction: column; gap: 18px; }
    .empty { margin: auto; text-align: center; max-width: 600px; padding: 30px 0; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: content-box; }
    .empty-title { font-size: 24px; font-weight: 700; letter-spacing: -1px; }
    .empty-desc { margin-top: 10px; color: var(--muted); font-size: 13.5px; min-height: 20px; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; flex-shrink: 0; width: 100%; max-width: 520px; }
    .suggestion { border: 1px solid var(--border); border-radius: 13px; background: #fff; padding: 14px; text-align: left; cursor: pointer; font-size: 13px; transition: all .15s; }
    .suggestion:hover { border-color: #c7d2fe; background: #fbfbff; box-shadow: var(--shadow); }
    .suggestion b { display: block; margin-bottom: 3px; }
    .message { display: flex; gap: 10px; max-width: 90%; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }
    .bubble { padding: 11px 14px; border-radius: 14px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user .bubble { background: #eef0f4; color: var(--text); border-top-right-radius: 5px; }
    .assistant .bubble { background: #fff; border: 1px solid var(--border); border-top-left-radius: 5px; }
    .msg-status { margin-top: 5px; font-size: 11.5px; color: var(--muted); }
    .msg-status.running { color: var(--primary); }
    .msg-status.done { color: var(--ok); }
    .msg-status.error { color: var(--danger); }
    .msg-duration { font-size: 14px; line-height: 1.65; color: #b0b5c4; margin-bottom: 4px; }

    .think-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; overflow: hidden; background: #fafbfc; }
    .think-header { padding: 7px 10px; font-size: 12px; color: #8a8fa0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
    .think-header:hover { background: #f0f1f5; }
    .think-arrow { font-size: 9px; transition: transform .15s; }
    .think-arrow.open { transform: rotate(180deg); }
    .think-content { padding: 8px 12px; font-size: 13px; color: #8a8fa0; line-height: 1.7; white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--border); max-height: 300px; overflow-y: auto; }
    .think-content.collapsed { display: none; }
    .cursor { color: var(--primary); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .composer-wrap { width: min(860px, 100%); margin: 0 auto; padding: 0 22px 18px; flex: 0 0 auto; }
    .composer { background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 13px; }
    .composer textarea { width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 14px; line-height: 1.6; min-height: 44px; max-height: 33vh; overflow-y: auto; }
    .composer-tools { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #f0f1f5; }
    .select, .input { border: 1px solid var(--border); border-radius: 9px; background: #fbfbfd; color: #4b5563; font-size: 12px; padding: 7px 9px; outline: 0; }
    #modelSelect { min-width: 120px; max-width: 200px; border: none; background: transparent; box-shadow: none; }
    #modelSelect:hover { background: #f0f1f4; }
    #modelSelect:focus { border: none; background: #f0f1f4; }
    .select:focus, .input:focus { border-color: #c7d2fe; background: #fff; }
    .path-input { flex: 1; min-width: 0; }
    .send-btn { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #1f2937; color: #fff; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .send-btn.stop { font-size: 16px; }
    .send-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }    .work-panel { background: #fff; border-left: 1px solid var(--border); padding: 18px 16px; overflow: auto; }
    .panel-closed .work-panel { display: none; }
    .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .panel-close { cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 4px; }
    .panel-close:hover { color: var(--text); }
    .work-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fafafa; }
    .work-card-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .work-item { font-size: 12.5px; color: #4b5563; display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f1f5; }
    .work-item:last-child { border-bottom: none; }
    .work-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
    .summary-row:last-child { margin-bottom: 0; }
    .open-folder-btn { flex: 0 0 auto; cursor: pointer; display: inline-flex; align-items: center; padding: 2px 4px; border-radius: 6px; }
    .open-folder-btn:hover { background: #e9ebf2; }
    .open-folder-btn:hover svg { stroke: var(--primary); }
    .summary-label { color: var(--muted); flex-shrink: 0; white-space: nowrap; margin-right: 8px; }
    .summary-row > span:last-child { flex: 1; min-width: 0; word-break: break-all; text-align: right; }

    .ext-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); line-height: 1.8; }
    .ext-note b { display: block; margin-bottom: 4px; color: #374151; }
    /* subtle scrollbar */
    .chat::-webkit-scrollbar, .project-list::-webkit-scrollbar, .work-panel::-webkit-scrollbar, #kbList::-webkit-scrollbar, #trashList::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-track, .project-list::-webkit-scrollbar-track, .work-panel::-webkit-scrollbar-track, #kbList::-webkit-scrollbar-track, #trashList::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb, .project-list::-webkit-scrollbar-thumb, .work-panel::-webkit-scrollbar-thumb, #kbList::-webkit-scrollbar-thumb, #trashList::-webkit-scrollbar-thumb { background: #e4e5ea; border-radius: 3px; }
    .chat::-webkit-scrollbar-thumb:hover, .project-list::-webkit-scrollbar-thumb:hover, .work-panel::-webkit-scrollbar-thumb:hover, #kbList::-webkit-scrollbar-thumb:hover, #trashList::-webkit-scrollbar-thumb:hover { background: #d6d7de; }
    .composer textarea::-webkit-scrollbar { width: 5px; }
    .composer textarea::-webkit-scrollbar-track { background: transparent; }
    .composer textarea::-webkit-scrollbar-thumb { background: #e4e5ea; border-radius: 3px; }
    .composer textarea::-webkit-scrollbar-thumb:hover { background: #d6d7de; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 16px; padding: 24px; width: 380px; box-shadow: var(--shadow); }
    .modal h3 { font-size: 16px; margin-bottom: 14px; }
    .modal input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 13.5px; outline: 0; margin-bottom: 12px; }
    .modal input:focus { border-color: #c7d2fe; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .modal-btn { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; }
    .modal-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .trash-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f0f1f5; font-size: 12.5px; }
    .trash-item:last-child { border-bottom: none; }
    .trash-info { min-width: 0; flex: 1; }
    .trash-time { flex: 0 0 auto; font-size: 11px; color: #b0b5c4; white-space: nowrap; }
    .trash-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
    .trash-proj { display: block; font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .trash-icon { flex: 0 0 auto; }
    .trash-item:last-child { border-bottom: none; }
    .trash-icon { flex: 0 0 auto; font-size: 14px; }
    .trash-info { flex: 1; min-width: 0; }
    .trash-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #374151; }
    .trash-proj { display: block; font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .trash-time { flex: 0 0 auto; font-size: 11px; color: #b0b5c4; }
    .trash-clear-btn { flex: 0 0 auto; cursor: pointer; display: inline-flex; align-items: center; padding: 3px 5px; border-radius: 6px; }
    .trash-clear-btn:hover { background: #fee2e2; }
    .trash-menu-btn {
      flex: 0 0 auto; font-size: 14px; color: #9ca3af; cursor: pointer;
      padding: 0 5px; border-radius: 5px; line-height: 1;
    }
    .trash-menu-btn:hover { color: var(--primary); background: #e5e7f0; }
    .trash-count { font-size: 12px; color: #9ca3af; }
    .kb-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid #f0f1f5; font-size: 12.5px; }
    .kb-item:last-child { border-bottom: none; }
    .kb-icon { flex: 0 0 auto; font-size: 14px; }
    .kb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
    .kb-meta { flex: 0 0 auto; font-size: 11px; color: #9ca3af; }
    .hidden { display: none !important; }
    @media (max-width: 1000px) {
      #app { grid-template-columns: 1fr; }
      #app.panel-closed { grid-template-columns: 1fr; }
      .sidebar, .work-panel { display: none !important; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">AI</div><span>智能体助手</span></div>
    <button class="new-conv" id="btnNewConv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-2px;margin-right:5px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新会话</button>
    <button class="new-project" id="btnNewProject"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-2px;margin-right:5px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建项目</button>
    <div class="project-list" id="projectList"></div>
    <div class="sidebar-footer">
      <div class="footer-link clickable" id="btnKnowledge"><span>知识库</span><span style="flex:1"></span><span class="badge idle" id="kbCount" style="display:none">0</span></div>
      <div class="footer-link disabled"><span>任务</span><span class="badge idle">预留</span></div>
      <div class="footer-link clickable" id="btnTrash"><span>回收站</span><span style="flex:1"></span><span class="trash-count" id="trashCountBadge">0</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <div class="top-title" id="topTitle">新会话</div>
        <div class="top-sub" id="topSub"></div>
      </div>
      <button class="panel-toggle" id="btnTogglePanel">
        <span class="status-dot off" id="breakerDot"></span>
        <span id="panelToggleText">收起面板</span>
      </button>
    </header>
    <section class="chat" id="chatArea"></section>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="给智能体发消息，Enter 发送，Shift+Enter 换行" rows="2"></textarea>
        <div class="composer-tools">
          <span style="flex:1"></span>
          <select class="select" id="modelSelect"><option value="">默认模型</option></select>
          <button class="send-btn" id="btnSend">➤</button>
        </div>
      </div>
    </div>
  </main>  <aside class="work-panel" id="workPanel">
    <div class="panel-title">工作面板<span class="panel-close" id="btnClosePanel">✕</span></div>
    <div class="work-card">
      <div class="work-card-title">当前项目<span class="open-folder-btn" id="btnOpenFolder" title="打开工作目录"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span></div>
      <div class="summary-row"><span class="summary-label">项目名称</span><span id="curProjectName">—</span></div>
      <div class="summary-row"><span class="summary-label">会话数量</span><span id="curConvCount">0</span></div>
      <div class="summary-row"><span class="summary-label">工作目录</span><span id="curWorkspace">默认沙箱根</span></div>
      <div class="summary-row"><span class="summary-label">项目 Token 总消耗</span><span id="curTokenCount">0</span></div>
    </div>
    <div class="work-card">
      <div class="work-card-title">近期生成文档 <span class="badge ok" id="docCount">0 份</span><span style="flex:1"></span><span class="doc-clear-btn" id="btnClearDocs">清理</span></div>
      <div id="recentDocs"></div>
    </div>
    <div class="work-card">
      <div class="work-card-title">进行中任务</div>
      <div id="runningTasks"><div style="padding:6px 0;font-size:12px;color:#b0b5c4">暂无执行中任务</div></div>
    </div>
    <div class="work-card">
      <div class="work-card-title">模型熔断状态</div>
      <div id="breakerList"><div style="padding:6px 0;font-size:12px;color:#b0b5c4">调用过模型后出现</div></div>
    </div>
    <div class="ext-note">
      <b>预留扩展位</b>
      未来可以在这里展示：<br>· 任务依赖图<br>· 知识库引用来源<br>· 文件预览 / 下载<br>· 执行日志
    </div>
  </aside>
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal">
      <h3>新建项目</h3>
      <input id="newProjectNameInput" placeholder="项目名称，如：项目A">

        <button class="modal-btn" id="btnCancelProject">取消</button>
        <button class="modal-btn primary" id="btnCreateProject">创建</button>

      <div class="modal-actions">
        <button class="modal-btn" id="btnCancelPicker">取消</button>
        <button class="modal-btn primary" id="btnConfirmPicker">确定</button>

    <div class="modal" style="width:420px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h3 style="margin:0">回收站</h3>
        <span class="trash-clear-btn" id="btnClearTrash" title="清空回收站"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
      </div>

        <button class="modal-btn" id="btnCloseKb">关闭</button>
      </div>

</div>
<script>
(function() {
  'use strict';
  var projects = [];
  var currentId = null;
  var currentProjectId = null;
  var streaming = false;
  var streamingConvId = null;
  var abortController = null;
  var timer = null;
  var elapsed = 0;
  var startTime = null;
  var breakerTimer = null;
  var panelOpen = true;
  var workspacePath = '';
  var models = [];
  var defaultModel = '';
  var breakers = {};
  var pendingMessage = null;
  var draftProjectSelected = false;
  var $ = function(id) { return document.getElementById(id); };
  var projectListEl = $('projectList');
  var chatAreaEl = $('chatArea');
  var inputEl = $('input');
  var modelSelectEl = $('modelSelect');
  var btnSendEl = $('btnSend');
  var topTitleEl = $('topTitle');
  var topSubEl = $('topSub');
  var workPanelEl = $('workPanel');
  var appEl = document.getElementById('app');
  var modalMaskEl = $('modalMask');
  var newProjectNameInput = $('newProjectNameInput');
  var newProjectPathInput = $('newProjectPathInput');
  var pickerMaskEl = $('pickerMask');
  var pickerSelectEl = $('pickerSelect');
  var projectMenuEl = null;
  function closeProjectMenu() {
    if (projectMenuEl) { projectMenuEl.remove(); projectMenuEl = null; }
  }
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function genId(prefix) {
    return prefix + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  }
  function dedupeIds() {
    var seen = {};
    projects.forEach(function(p) {
      if (p.id && String(p.id).indexOf('web-') === 0) {
        if (seen[p.id]) p.id = genId('p-');
        seen[p.id] = true;
      }
      var convSeen = {};
      p.conversations.forEach(function(c) {
        if (c.id && String(c.id).indexOf('web-') === 0) {
          if (convSeen[c.id] || seen['conv_' + c.id]) c.id = genId('web-');
          convSeen[c.id] = true;
          seen['conv_' + c.id] = true;
        }
      });
    });
  }
  function curProject() {
    if (currentProjectId) {
      var p = projects.find(function(x){ return x.id === currentProjectId; });
      if (p) return p;
    }
    return projects.find(function(p){
      return p.conversations.some(function(c){ return c.id === currentId; });
    }) || null;
  }
  function curConv() {
    var p = curProject();
    if (!p) return null;
    return p.conversations.find(function(c){ return c.id === currentId; }) || null;
  }
  function loadDurations() {
    try { return JSON.parse(localStorage.getItem('agent_durations') || '{}'); } catch(e) { return {}; }
  }
  function saveDuration(convId, idx, duration) {
    try {
      var d = loadDurations();
      if (!d[convId]) d[convId] = {};
      d[convId][idx] = duration;
      localStorage.setItem('agent_durations', JSON.stringify(d));
    } catch(e) {}
  }
  function parseThinkContent(raw) {
    if (!raw) return { think: '', main: '', hasThink: false, thinkDone: false };
    var thinkStart = raw.indexOf('<think>');
    if (thinkStart < 0) return { think: '', main: raw, hasThink: false, thinkDone: false };
    var thinkEnd = raw.indexOf('</think>');
    var before = raw.substring(0, thinkStart);
    if (thinkEnd >= 0) {
      return {
        think: raw.substring(thinkStart + 7, thinkEnd),
        main: before + raw.substring(thinkEnd + 8),
        hasThink: true,
        thinkDone: true
      };
    }
    return { think: raw.substring(thinkStart + 7), main: before, hasThink: true, thinkDone: false };
  }
  function formatDuration(d) {
    var s = Math.round(parseFloat(d) || 0);
    var min = Math.floor(s / 60);
    var sec = s % 60;
    if (min > 0) return min + '\u5206\u949F' + (sec < 10 ? '0' : '') + sec + '\u79D2';
    return sec + '\u79D2';
  }
  function loadTrash() {
    try { return JSON.parse(localStorage.getItem('agent_trash') || '[]'); } catch(e) { return []; }
  }
  function addToTrash(item) {
    try {
      var items = loadTrash();
      items.unshift(item);
      if (items.length > 30) items = items.slice(0, 30);
      localStorage.setItem('agent_trash', JSON.stringify(items));
    } catch(e) {}
  }
  function renderTrash() {
    var items = loadTrash();
    updateTrashCount();
    var list = $('trashList');
    if (!items.length) {
      list.innerHTML = '<div style="padding:24px;text-align:center;color:#b0b5c4;font-size:13px">\u56DE\u6536\u7AD9\u662F\u7A7A\u7684</div>';
      return;
    }
    list.innerHTML = items.map(function(t, idx) {
      var svgFolder = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
      var svgChat = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H12l-4 4v-4H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
      var icon = t.type === 'project' ? svgFolder : svgChat;
      var proj = (t.type === 'conv' && t.projectName) ? '<span class="trash-proj">\u6765\u81EA\uFF1A' + esc(t.projectName) + '</span>' : '';
      var time = new Date(t.deletedAt).toLocaleString();
      return '<div class="trash-item">' +
        '<span class="trash-icon">' + icon + '</span>' +
        '<span class="trash-info"><span class="trash-name">' + esc(t.name) + '</span>' + proj + '</span>' +
        '<span class="trash-time">' + time + '</span>' +
        '<span class="trash-menu-btn" data-idx="' + idx + '" title="\u64CD\u4F5C">\u22EF</span>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.trash-menu-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var idx = parseInt(btn.getAttribute('data-idx'));
        closeProjectMenu();
        projectMenuEl = document.createElement('div');
        projectMenuEl.className = 'project-dropdown';
        [
          { label: '\u8FD8\u539F', fn: function() { restoreFromTrash(idx); } },
          { label: '\u5220\u9664', fn: function() {
              var items = loadTrash();
              items.splice(idx, 1);
              localStorage.setItem('agent_trash', JSON.stringify(items));
              updateTrashCount();
              renderTrash();
            } }
        ].forEach(function(mi2) {
          var mi = document.createElement('div');
          mi.className = 'project-menu-item';
          mi.textContent = mi2.label;
          mi.addEventListener('click', function() {
            closeProjectMenu();
            mi2.fn();
          });
          projectMenuEl.appendChild(mi);
        });
        document.body.appendChild(projectMenuEl);
        var rect = btn.getBoundingClientRect();
        projectMenuEl.style.top = (rect.bottom + 4) + 'px';
        projectMenuEl.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
      });
    });
  }
  function updateTrashCount() {
    var count = loadTrash().length;
    var badge = $('trashCountBadge');
    if (badge) {
      badge.textContent = count > 0 ? count : '';
    }
  }
  function restoreFromTrash(idx) {
    var items = loadTrash();
    if (idx < 0 || idx >= items.length) return;
    var t = items[idx];
    items.splice(idx, 1);
    localStorage.setItem('agent_trash', JSON.stringify(items));
    if (t.type === 'conv') {
      var p = projects.find(function(x){ return x.name === t.projectName; });
      if (!p) {
        p = { id: genId('p-'), name: t.projectName || '\u9ED8\u8BA4\u9879\u76EE', path: '', open: true, conversations: [] };
        projects.push(p);
      }
      var exists = p.conversations.some(function(x){ return x.id === t.id; });
      if (!exists) {
        p.conversations.unshift({ id: t.id, title: t.name, messages: t.messages || [], loaded: true, remote: false });
        p.open = true;
        currentProjectId = p.id;
        currentId = t.id;
      }
    } else if (t.type === 'project') {
      var existsP = projects.some(function(x){ return x.id === t.id; });
      if (!existsP) {
        projects.push({ id: t.id, name: t.name, path: '', open: true, conversations: t.conversations || [] });
      }
    }
    saveProjects();
    renderProjects();
    renderChat();
    renderPanel();
    renderTrash();
  }
  function loadKnowledge() {
    var list = $('kbList');
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#b0b5c4;font-size:13px">\u52A0\u8F7D\u4E2D...</div>';
    fetch('/api/knowledge/documents')
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(j) {
        var items = j.data || [];
        var badge = $('kbCount');
        if (badge) {
          badge.textContent = items.length;
          badge.style.display = items.length > 0 ? '' : 'none';
        }
        if (!items.length) {
          list.innerHTML = '<div style="padding:24px;text-align:center;color:#b0b5c4;font-size:13px">\u6682\u65E0\u5165\u5E93\u6587\u6863</div>';
          return;
        }
        var svgFile = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
        var svgTable = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>';
        var svgBook = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
        var icons = { txt: svgFile, docx: svgFile, doc: svgFile, xlsx: svgTable, xls: svgTable, csv: svgTable, pdf: svgBook };
        list.innerHTML = items.map(function(item) {
          var displayName = item.name || '';
          var ext = (item.name || '').split('.').pop().toLowerCase();
          var icon = icons[ext] || svgFile;
          var meta = item.chunks != null ? item.chunks + ' \u5207\u7247' : '';
          return '<div class="kb-item">' +
            '<span class="kb-icon">' + icon + '</span>' +
            '<span class="kb-name">' + esc(displayName) + '</span>' +
            '<span class="kb-meta">' + meta + '</span>' +
          '</div>';
        }).join('');
      })
      .catch(function(e) {
        console.warn('\u77E5\u8BC6\u5E93\u63A5\u53E3\u672A\u5C31\u7EEA', e);
        list.innerHTML = '<div style="padding:24px;text-align:center;color:#b0b5c4;font-size:13px">\u6682\u65E0\u5165\u5E93\u6587\u6863</div>';
      });
  }
  function loadHiddenDocs() {
    try { return JSON.parse(localStorage.getItem('agent_hidden_docs') || '[]'); } catch(e) { return []; }
  }
  function saveHiddenDocs(arr) {
    try { localStorage.setItem('agent_hidden_docs', JSON.stringify(arr)); } catch(e) {}
  }
  function loadProjects() {
    try {
      var saved = localStorage.getItem('agent_projects');
      if (saved) {
        projects = JSON.parse(saved);
        dedupeIds();
        return;
      }
    } catch(e) {}
    projects = [{ id: 'default', name: '默认项目', path: '', open: true, conversations: [] }];
  }
  function saveProjects() {
    try { localStorage.setItem('agent_projects', JSON.stringify(projects)); } catch(e) {}
  }  function renderProjects() {
    projectListEl.innerHTML = '';
    projects.forEach(function(p) {
      var div = document.createElement('div');
      div.className = 'project' + (p.open ? ' open' : '') + (!currentId && p.id === currentProjectId ? ' active-project' : '');
      var header = document.createElement('div');
      header.className = 'project-header';
      var left = document.createElement('span');
      left.style.cssText = 'min-width:0;flex:1;overflow:hidden';
      left.innerHTML = '<span class="name-line"><span class="folder-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>' + esc(p.name) + '</span>';
      var right = document.createElement('span');
      right.style.cssText = 'display:flex;align-items:center;gap:2px';
      var menuBtn = document.createElement('span');
      menuBtn.className = 'project-menu-btn';
      menuBtn.textContent = '\u22EF';
      menuBtn.title = '\u9879\u76EE\u64CD\u4F5C';
      menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeProjectMenu();
        projectMenuEl = document.createElement('div');
        projectMenuEl.className = 'project-dropdown';
        [
          { label: '\u65B0\u5EFA\u4F1A\u8BDD', fn: function() { startDraft(p.id); } },
          { label: '\u91CD\u547D\u540D', fn: function() { renameProject(p); } },
          { label: '\u4FEE\u6539\u8DEF\u5F84', fn: function() { editProjectPath(p); } },
          { label: '\u5220\u9664\u9879\u76EE', fn: function() { deleteProject(p); } }
        ].forEach(function(item) {
          var mi = document.createElement('div');
          mi.className = 'project-menu-item';
          mi.textContent = item.label;
          mi.addEventListener('click', function() {
            closeProjectMenu();
            item.fn();
          });
          projectMenuEl.appendChild(mi);
        });
        document.body.appendChild(projectMenuEl);
        var rect = menuBtn.getBoundingClientRect();
        projectMenuEl.style.top = (rect.bottom + 4) + 'px';
        projectMenuEl.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
      });
      right.appendChild(menuBtn);
      header.appendChild(left);
      header.appendChild(right);
      header.addEventListener('click', function() { toggleProject(p); });
      var convList = document.createElement('div');
      convList.className = 'conv-list';
      if (p.conversations.length) {
        p.conversations.forEach(function(c) {
          var item = document.createElement('div');
          item.className = 'conv-item' + (c.id === currentId ? ' active' : '');
          var title = document.createElement('span');
          title.className = 'conv-title';
          title.textContent = c.title;
          var convMenuBtn = document.createElement('span');
          convMenuBtn.className = 'conv-menu-btn';
          convMenuBtn.textContent = '\u22EF';
          convMenuBtn.title = '\u4F1A\u8BDD\u64CD\u4F5C';
          convMenuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeProjectMenu();
            projectMenuEl = document.createElement('div');
            projectMenuEl.className = 'project-dropdown';
            [
              { label: '\u91CD\u547D\u540D', fn: function() { renameConv(c); } },
              { label: '\u5220\u9664', fn: function() { deleteConv(c.id); } }
            ].forEach(function(mi2) {
              var mi = document.createElement('div');
              mi.className = 'project-menu-item';
              mi.textContent = mi2.label;
              mi.addEventListener('click', function() {
                closeProjectMenu();
                mi2.fn();
              });
              projectMenuEl.appendChild(mi);
            });
            document.body.appendChild(projectMenuEl);
            var rect = convMenuBtn.getBoundingClientRect();
            projectMenuEl.style.top = (rect.bottom + 4) + 'px';
            projectMenuEl.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
          });
          item.appendChild(title);
          item.appendChild(convMenuBtn);
          item.addEventListener('click', function() { selectConv(c.id); });
          convList.appendChild(item);
        });
      } else {
        var empty = document.createElement('div');
        empty.style.cssText = 'padding:6px 10px;font-size:12px;color:#b0b5c4';
        empty.textContent = '\u6682\u65E0\u4F1A\u8BDD';
        convList.appendChild(empty);
      }
      div.appendChild(header);
      div.appendChild(convList);
      projectListEl.appendChild(div);
    });
  }
  function renderChat() {
    var conv = curConv();
    var p = curProject();
    topTitleEl.textContent = conv ? conv.title : '\u65B0\u4F1A\u8BDD';
    var sessionTokens = 0;
    if (conv) {
      conv.messages.forEach(function(mm) {
        if (mm.usage) sessionTokens += (mm.usage.prompt_tokens || 0) + (mm.usage.completion_tokens || 0);
      });
    }
    var parts = [];
    if (p && draftProjectSelected) parts.push(p.name);
    if (workspacePath && draftProjectSelected) parts.push(workspacePath);
    if (sessionTokens > 0) parts.push('\u5F53\u524D\u4F1A\u8BDD\u7D2F\u8BA1\uFF1A' + sessionTokens.toLocaleString() + ' tokens');
    topSubEl.textContent = parts.join(' \u00A0|\u00A0 ');
    chatAreaEl.innerHTML = '';
    if (!conv || !conv.messages.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML =
        '<div class="empty-title">\u4F60\u597D\uFF0C\u4ECA\u5929\u8981\u5904\u7406\u4EC0\u4E48\uFF1F</div>' +
        '<div class="suggestions">' +
          '<button class="suggestion" data-q="\u4F60\u597D\uFF0C\u4ECB\u7ECD\u4E00\u4E0B\u4F60\u81EA\u5DF1"><b>\u81EA\u6211\u4ECB\u7ECD</b>\u4E86\u89E3\u5F53\u524D\u7CFB\u7EDF\u53EF\u4EE5\u505A\u4EC0\u4E48</button>' +
          '<button class="suggestion" data-q="\u603B\u7ED3\u77E5\u8BC6\u5E93\u4E2D\u5173\u4E8E\u6DF7\u51DD\u571F\u517B\u62A4\u7684\u5185\u5BB9"><b>\u77E5\u8BC6\u5E93\u68C0\u7D22</b>\u4ECE\u5DF2\u6709\u8D44\u6599\u603B\u7ED3\u5173\u952E\u4FE1\u606F</button>' +
          '<button class="suggestion" data-q="\u628A\u4E0A\u4E00\u8F6E\u7ED3\u679C\u5199\u5165 Word \u6587\u4EF6"><b>\u6587\u6863\u5199\u5165</b>\u751F\u6210\u4E00\u4EFD Word \u6587\u6863</button>' +
          '<button class="suggestion" data-q="\u68C0\u67E5\u4EFB\u52A1\u6267\u884C\u72B6\u6001"><b>\u72B6\u6001\u68C0\u67E5</b>\u67E5\u770B Agent \u8C03\u5EA6\u60C5\u51B5</button>' +
        '</div>';
      chatAreaEl.appendChild(empty);
      empty.querySelectorAll('.suggestion').forEach(function(btn) {
        btn.addEventListener('click', function() {
          inputEl.value = btn.getAttribute('data-q');
          send();
        });
      });
      return;
    }
    conv.messages.forEach(function(m, i) {
      var wrap = document.createElement('div');
      wrap.className = 'message ' + m.role;
      var right = document.createElement('div');
      if (m.role === 'assistant') {
        var isRunning = (i === conv.messages.length - 1 && streaming && m.status === 'running');
        var durEl = document.createElement('div');
        durEl.className = 'msg-duration';
        if (isRunning) {
          durEl.textContent = '\u6267\u884C\u4E2D\uFF1A' + formatDuration(elapsed);
        } else if (m.duration) {
          durEl.textContent = '\u603B\u7528\u65F6\uFF1A' + formatDuration(m.duration);
        }
        if (!isRunning && m.usage) {
          var totalTok = (m.usage.prompt_tokens || 0) + (m.usage.completion_tokens || 0);
          var tokText = ' \u00A0|\u00A0 \u6D88\u8017\uFF1A' + totalTok.toLocaleString() + ' tokens';
        } else {
          var tokText = '';
        }
        if (durEl) {
          if (isRunning) {
            durEl.textContent = '\u6267\u884C\u4E2D\uFF1A' + formatDuration(elapsed);
          } else if (m.duration) {
            durEl.textContent = '\u603B\u7528\u65F6\uFF1A' + formatDuration(m.duration) + tokText;
          } else if (tokText) {

        models = j.data || [];
        defaultModel = j.default_model || '';
        modelSelectEl.innerHTML = '<option value="">' + (defaultModel ? defaultModel + '\uFF08\u9ED8\u8BA4\uFF09' : '\u9ED8\u8BA4\u6A21\u578B') + '</option>';
        models.forEach(function(m) {
          var opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          modelSelectEl.appendChild(opt);
        });
      })
      .catch(function(e){
        console.error('\u52A0\u8F7D\u6A21\u578B\u5931\u8D25', e);
        modelSelectEl.innerHTML = '<option value="">\u52A0\u8F7D\u5931\u8D25</option>';
      });
  }
  function loadBreakers() {
    fetch('/api/health/breakers')
      .then(function(r){ return r.json(); })
      .then(function(j) {
        breakers = j.data || {};
        renderPanel();
      })
      .catch(function(e){});
  }
  $('btnNewProject').addEventListener('click', showNewProjectModal);
  $('btnCreateProject').addEventListener('click', createProject);
  $('btnCancelProject').addEventListener('click', function(){ modalMaskEl.classList.add('hidden'); });
  function buildPickerOptions(defaultToNew) {
    pickerSelectEl.innerHTML = '';
    if (defaultToNew) {
      var newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '\u2795 \u65B0\u5EFA\u9879\u76EE';
      pickerSelectEl.appendChild(newOpt);
    }
    projects.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      pickerSelectEl.appendChild(opt);
    });
    if (!defaultToNew && currentProjectId) pickerSelectEl.value = currentProjectId;
  }
  function showPickerForNewConv() {
    buildPickerOptions(true);
    pickerMaskEl.classList.remove('hidden');
  }
  $('btnNewConv').addEventListener('click', function() {
    buildPickerOptions(false);
    pickerMaskEl.classList.remove('hidden');
  });
  $('btnConfirmPicker').addEventListener('click', function() {
    var pid = pickerSelectEl.value;
    pickerMaskEl.classList.add('hidden');
    if (pid === '__new__') {
      var name = '\u9879\u76EE' + (projects.length + 1);
      var p = { id: genId('p-'), name: name, path: '', open: true, conversations: [] };
      projects.push(p);
      currentProjectId = p.id;
      saveProjects();
    } else {
      currentProjectId = pid;
    }
    draftProjectSelected = true;
    if (pendingMessage) {
      inputEl.value = pendingMessage;
      pendingMessage = null;
      send();
    } else {
      startDraft(currentProjectId);
    }
  });
  function cancelPicker() {
    pickerMaskEl.classList.add('hidden');
    if (pendingMessage) {
      inputEl.value = pendingMessage;
      pendingMessage = null;
    }
  }
  $('btnCancelPicker').addEventListener('click', cancelPicker);
  pickerMaskEl.addEventListener('click', function(e) {
    if (e.target === pickerMaskEl) cancelPicker();
  });
  $('btnTogglePanel').addEventListener('click', function() {
    panelOpen = !panelOpen;
    $('panelToggleText').textContent = panelOpen ? '\u6536\u8D77\u9762\u677F' : '\u5DE5\u4F5C\u9762\u677F';
    workPanelEl.classList.toggle('hidden', !panelOpen);
    appEl.classList.toggle('panel-closed', !panelOpen);
  });
  $('btnClosePanel').addEventListener('click', function() {
    panelOpen = false;
    $('panelToggleText').textContent = '\u5DE5\u4F5C\u9762\u677F';
    workPanelEl.classList.add('hidden');
    appEl.classList.add('panel-closed');
  });
  modalMaskEl.addEventListener('click', function(e) {
    if (e.target === modalMaskEl) modalMaskEl.classList.add('hidden');
  });
  newProjectNameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') createProject(); });
  newProjectPathInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') createProject(); });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.altKey) {
      e.preventDefault();
      var start = inputEl.selectionStart, end = inputEl.selectionEnd;
      inputEl.value = inputEl.value.slice(0, start) + '\n' + inputEl.value.slice(end);
      inputEl.selectionStart = inputEl.selectionEnd = start + 1;
      inputEl.dispatchEvent(new Event('input'));
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey) { e.preventDefault(); streaming ? stop() : send(); }
  });
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    var maxH = Math.floor(window.innerHeight / 3);
    inputEl.style.height = Math.min(inputEl.scrollHeight, maxH) + 'px';
  });
  btnSendEl.addEventListener('click', function() { streaming ? stop() : send(); });
  document.querySelector('.brand').addEventListener('click', function() {
    currentId = null;
    draftProjectSelected = false;
    renderProjects();
    renderChat();
    renderPanel();
  });
  document.addEventListener('click', function() { closeProjectMenu(); });
  updateTrashCount();
  $('btnClearDocs').addEventListener('click', function() {
    var all = [];
    projects.forEach(function(pj) {
      pj.conversations.forEach(function(c) {
        c.messages.forEach(function(m) {
          if (m.role !== 'assistant') return;
          var regexes = [
            /(?:\u6210\u529F|\u5DF2)(?:\u751F\u6210|\u5199\u5165|\u8FFD\u52A0|\u521B\u5EFA|\u4FDD\u5B58)[^\n]{0,100}?([\w\u4e00-\u9fa5()（）\-\s\\\/:]+\.(?:docx|xlsx|txt))/g,
            /([\w\u4e00-\u9fa5()（）\-\s\\\/:]+\.(?:docx|xlsx|txt))[^\n]{0,30}?(?:\u5DF2\u751F\u6210|\u5DF2\u5199\u5165|\u5DF2\u4FDD\u5B58|\u5DF2\u521B\u5EFA)/g
          ];
          regexes.forEach(function(regex) {
            var match;
            while ((match = regex.exec(m.content)) !== null) {
              var fname = match[1].trim();
              var lastSlash = Math.max(fname.lastIndexOf('\\'), fname.lastIndexOf('/'));
              if (lastSlash >= 0) fname = fname.substring(lastSlash + 1);
              if (fname && all.indexOf(fname) < 0) all.push(fname);
            }
          });
        });
      });
    });
    saveHiddenDocs(all);
    renderPanel();
  });
  $('btnOpenFolder').addEventListener('click', function() {
    var p = curProject();
    var folderPath = (p && p.path) ? p.path : '';
    if (!folderPath) {
      alert('\u5F53\u524D\u9879\u76EE\u672A\u7ED1\u5B9A\u5DE5\u4F5C\u76EE\u5F55');
      return;
    }
    fetch('/api/open-folder?path=' + encodeURIComponent(folderPath))
      .then(function(r){ return r.json(); })
      .then(function(j) {
        if (j.code !== 200) alert('\u6253\u5F00\u5931\u8D25\uFF1A' + (j.msg || '\u672A\u77E5\u9519\u8BEF'));
      })
      .catch(function(e) {
        alert('\u63A5\u53E3\u672A\u5C31\u7EEA\uFF0C\u8BF7\u5728\u540E\u7AEF\u6DFB\u52A0 /api/open-folder \u63A5\u53E3');
      });
  });
  $('btnKnowledge').addEventListener('click', function() {
    loadKnowledge();
    $('kbMask').classList.remove('hidden');
  });
  $('btnCloseKb').addEventListener('click', function(){ $('kbMask').classList.add('hidden'); });
  $('kbMask').addEventListener('click', function(e) {
    if (e.target === $('kbMask')) $('kbMask').classList.add('hidden');
  });
  $('btnTrash').addEventListener('click', function() {
    renderTrash();
    $('trashMask').classList.remove('hidden');
  });
  $('btnClearTrash').addEventListener('click', function() {
    if (!confirm('\u786E\u5B9A\u6E05\u7A7A\u56DE\u6536\u7AD9\u5417\uFF1F')) return;
    localStorage.setItem('agent_trash', '[]');
    updateTrashCount();
    renderTrash();
  });
  $('trashMask').addEventListener('click', function(e) {
    if (e.target === $('trashMask')) $('trashMask').classList.add('hidden');
  });
  loadProjects();
  loadConversations();
  loadModels();
  loadBreakers();
  breakerTimer = setInterval(loadBreakers, 3000);
  renderProjects();
  renderChat();
  renderPanel();
})();
</script>
</body>
</html>
